<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hardware Blueprint Viewer</title>
<style>
:root{--bg:#f6f6f4;--surface:#ffffff;--text:#151515;--muted:#6b6d6c;--line:#e2e3e1;--accent:#2f6fed;--ok:#2f8f4e;--warn:#b7791f;--err:#c53030;
--mcu:#047878;--sensor:#347199;--actuator:#b2522f;--power:#7b6527;--module:#7253ad;--display:#995e71;--structural:#436b98;--enclosure:#74619d;--mechanism:#8b6137;--misc:#776946;--printed:#69743a;--other:#6e6f6f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#131313;--surface:#1c1c1c;--text:#f0f0ef;--muted:#9d9f9e;--line:#2c2d2c;--accent:#6fa0ff;
--mcu:#06abab;--sensor:#418dbf;--actuator:#df663b;--power:#f5c94e;--module:#957ec2;--display:#db87a1;--structural:#6fb2fd;--enclosure:#a58be0;--mechanism:#e8a25b;--misc:#b7a26b;--printed:#bfd36a;--other:#9d9f9e}}
:root[data-theme="dark"]{--bg:#131313;--surface:#1c1c1c;--text:#f0f0ef;--muted:#9d9f9e;--line:#2c2d2c;--accent:#6fa0ff;--mcu:#06abab;--sensor:#418dbf;--actuator:#df663b;--power:#f5c94e;--module:#957ec2;--display:#db87a1;--structural:#6fb2fd;--enclosure:#a58be0;--mechanism:#e8a25b;--misc:#b7a26b;--printed:#bfd36a;--other:#9d9f9e}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,sans-serif}
header.top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.titlebox{display:flex;flex-direction:column;min-width:0}.titlebox .row{display:flex;gap:10px;align-items:center}
h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.back{color:var(--muted);text-decoration:none;font:600 12px/1 inherit;letter-spacing:.06em;text-transform:uppercase}.back:hover{color:var(--text)}
nav{display:flex;gap:2px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
nav button,.btn{border:1px solid transparent;background:none;color:var(--muted);padding:6px 10px;border-radius:8px;font:600 12px/1 inherit;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;min-height:32px;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
nav button svg,.btn svg{width:14px;height:14px;flex:none}
nav button[aria-selected="true"]{background:var(--text);color:var(--bg)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border-color:var(--line);color:var(--text)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.btn.ghost{border-color:transparent}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.sm{min-height:26px;padding:4px 8px;font-size:11px}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
main{max-width:1200px;margin:0 auto;padding:16px}section[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.muted{color:var(--muted)}.small{font-size:12px}.label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
tr.part{cursor:pointer}tr.part:hover td{background:var(--bg)}tr.detail td{background:var(--bg)}tfoot td{font-weight:700;border-bottom:none}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px solid currentColor}
.sev-error{color:var(--err)}.sev-warning{color:var(--warn)}.sev-info{color:var(--muted)}.ok{color:var(--ok)}.err{color:var(--err)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.kpi b{display:block;font-size:20px}
.info-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.hero svg,.hero img{width:100%;height:auto;display:block;border-radius:10px}
.author{display:inline-flex;gap:6px;align-items:center;font-size:13px}.avatar{width:14px;height:14px;border-radius:3px;display:inline-block}
.tt .tr{display:grid;grid-template-columns:minmax(0,1fr) 70px 90px;gap:8px;padding:7px 8px;border-bottom:1px solid var(--line);align-items:center}
.tt .tr.head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.tt .tr[hidden]{display:none}
.tt .l0{font-weight:600}.tt .l1{padding-left:26px}.tt .l2{padding-left:52px;color:var(--muted)}.tt .num{text-align:right;font-variant-numeric:tabular-nums}
.tog{border:none;background:none;color:inherit;cursor:pointer;padding:0 4px 0 0;font:inherit;display:inline-flex;align-items:center;gap:4px;text-align:left}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}.toolbar label{font-size:12px;display:flex;gap:4px;align-items:center}
.split{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
#wiring{overflow:hidden;position:relative;height:560px;cursor:grab;touch-action:none}#wiring svg{display:block;width:100%;height:100%}
#mechwrap{position:relative;height:560px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}#mech{width:100%;height:100%;display:block;touch-action:none}
#mechwrap:fullscreen{border-radius:0}
.overlay{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.overlay .btn{background:var(--surface)}
#mechinfo{font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
#axislabels span{position:absolute;font:700 11px/1 Inter,system-ui,sans-serif;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:2px 5px;pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap}
.side .row{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:13px;min-height:28px}.side .row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .row.off .name{opacity:.45}.eye{border:1px solid var(--line);background:none;border-radius:6px;width:26px;height:24px;cursor:pointer;color:var(--text);display:inline-flex;align-items:center;justify-content:center}.eye svg{width:14px;height:14px}
.cadbtn{border:1px solid var(--line);background:none;border-radius:999px;min-width:26px;height:24px;cursor:pointer;color:var(--muted);font:600 10px/1 inherit;padding:0 6px}
.cadbtn.done{border-color:var(--ok);color:var(--ok)}.cadbtn.busy{opacity:.6}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:10px;font-size:12px}.legend label{display:flex;gap:4px;align-items:center;cursor:pointer}
.progressbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.meter{height:6px;background:var(--line);border-radius:999px;overflow:hidden;flex:1;max-width:240px}.meter i{display:block;height:100%;background:var(--ok)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.cols ul{margin:0;padding-left:18px}
.step{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:12px;overflow:hidden}
.step>.head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.step>.head b{font-size:15px}.count{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}.count.full{border-color:var(--ok);color:var(--ok)}
.sub{padding:12px 16px;border-bottom:1px solid var(--line)}.sub:last-child{border-bottom:none}.sub label.step-title{display:flex;gap:10px;align-items:flex-start;font-weight:600;cursor:pointer}
.sub input[type=checkbox]{width:16px;height:16px;margin-top:2px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 26px}.chip{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted)}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:10px 0 0 26px}.pcard{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center}
.pcard .ic{width:30px;height:30px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}.pcard .ic svg{width:16px;height:16px}
.more{margin:8px 0 0 26px}.more .btn{padding-left:0}
details.menu{position:relative}details.menu>summary{list-style:none}details.menu>summary::-webkit-details-marker{display:none}
details.menu .items{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:240px;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.12)}
details.menu .items button,details.menu .items a{display:flex;width:100%;justify-content:space-between;border:none;background:none;color:var(--text);padding:8px 10px;border-radius:6px;font:13px/1.2 inherit;cursor:pointer;text-decoration:none}
details.menu .items button:hover,details.menu .items a:hover{background:var(--bg)}details.menu .items .sep{border-top:1px solid var(--line);margin:4px 0}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-size:12px}
select,input[type=text],input[type=email],input[type=number],textarea{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:32px;font:inherit}
textarea{width:100%;min-height:120px;resize:vertical}
a{color:var(--accent)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(0,0,0,.35)}dialog .dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}dialog .db{padding:16px;overflow:auto;max-height:calc(100vh - 140px)}
dialog h3{margin:0;font-size:15px}dialog h4{margin:16px 0 8px;font-size:13px}dialog .rowf{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list .li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
#chat{position:fixed;right:16px;bottom:16px;width:min(400px,calc(100vw - 32px));z-index:6}#chat .card{margin:0;box-shadow:0 6px 24px rgba(0,0,0,.12)}
#chatlog{max-height:300px;overflow:auto;font-size:13px}#chatlog .turn{border-top:1px solid var(--line);padding:6px 0}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pchips button{font-size:12px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--text);padding:4px 10px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:13px;z-index:20;max-width:calc(100vw - 32px)}
#banner{background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:center}
@media (max-width:900px){.split{grid-template-columns:1fr}.info-top{grid-template-columns:1fr}}
@media (max-width:640px){#mechwrap{height:380px}#wiring{height:420px}th:nth-child(4),td:nth-child(4){display:none}.cols{grid-template-columns:1fr}h1{max-width:60vw}nav{width:100%;justify-content:space-between}nav button{padding:6px 7px}nav button span{display:none}}
</style>
</head>

function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
async function api(path,body,method){const r=await fetch(path,{method:method||(body?'POST':'GET'),headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const ct=r.headers.get('content-type')||'';const d=ct.includes('json')?await r.json().catch(()=>({})):await r.blob();
  if(!r.ok){const e=new Error((d.detail&&(d.detail.message||d.detail.error))||d.detail||('HTTP '+r.status));e.status=r.status;e.code=d.detail&&d.detail.error;throw e;}return d;}

function render(p){
  $('title').textContent=p.projectName||'Project';document.title=(p.projectName||'Project')+' · Hardware Blueprint';
  const nodes=p.nodes||[];
  const author=(API&&API.meta&&API.meta.author)||(API&&API.pub&&API.pub.author)||null;
  if(author)$('author').innerHTML=`<span class="avatar" style="background:${esc(author.profileColor||'#888')}"></span>${esc(author.username)}`;
  headerActions();
  renderInfo(p,nodes,author);renderParts(p,nodes);setupWiring(p);renderGuide(p,nodes);
  const fw=p.firmware||{};$('tab-code').innerHTML=Object.keys(fw).length?Object.entries(fw).map(([f,t])=>`<div class="card"><b>${esc(f)}</b><pre>${esc(t)}</pre></div>`).join(''):'<div class="card muted">No firmware in this document.</div>';
  const tabs=[...document.querySelectorAll('nav button')];let mechInit=false;
  function show(name){tabs.forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===name));document.querySelectorAll('main>section').forEach(s=>s.hidden=s.id!=='tab-'+name);store('hwbp:tab',name);if(name==='mech'&&!mechInit){mechInit=true;setupMech(p);}}

  if(PID)liveEvents();
}

function costTree(nodes){
  const cats={};for(const n of nodes){const c=n.category||'electrical',t=n.type||'other';((cats[c]=cats[c]||{})[t]=cats[c][t]||[]).push(n);}

function setupWiring(p){

  if(!layouts.simple||!layouts.simple.nodes){el.innerHTML='<p class="muted">No wiring layout in this document.</p>';side.hidden=true;return;}

  tools.innerHTML=`<button class="btn" data-mode="simple" aria-pressed="true">Simple</button>${layouts.enriched?'<button class="btn" data-mode="enriched" aria-pressed="false">Enriched</button>':''}
  ${['data','power','ground'].map(t=>`<label><input type="checkbox" data-edge="${t}" checked/> ${t.toUpperCase()}</label>`).join('')}
  <button class="btn" data-zoom="in" aria-label="Zoom in">+</button><button class="btn" data-zoom="out" aria-label="Zoom out">−</button><button class="btn" data-zoom="fit">Fit</button>`;
  const groups={};for(const [id,m] of Object.entries(meta0)){(groups[m.type]=groups[m.type]||[]).push([id,m]);}
  side.innerHTML='<p class="label">Electrical parts</p>'+Object.entries(groups).map(([t,list])=>`<div style="margin-bottom:8px"><label class="small" style="display:flex;gap:6px;align-items:center;font-weight:600"><input type="checkbox" data-cat="${esc(t)}" checked/><span class="dot" style="background:${color(t)}"></span>${esc((LABEL[t]||t).toUpperCase())} <span class="muted">(${list.length})</span></label>
    ${list.map(([id,m])=>`<div class="row"><button class="tog small" data-focus="${esc(id)}" style="padding-left:22px">${esc(m.name||id)}</button></div>`).join('')}</div>`).join('');
  let vb=null;
  const draw=()=>{const L=layouts[mode],meta=L.nodeMeta||{},m=24,W=L.width+2*m,H=L.height+2*m;vb=vb||[0,0,W,H];
    const st={data:[css('--ok'),2,''],power:[css('--power'),1.5,'4 4'],ground:[css('--muted'),1,'2 3']};
    const vis=id=>!hidden.has('cat:'+((meta[id]||{}).type));
    const near=id=>!focus||id===focus||L.edges.some(e=>(e.source===focus&&e.target===id)||(e.target===focus&&e.source===id));
    let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb.join(' ')}" preserveAspectRatio="xMidYMid meet" font-family="Inter,system-ui,sans-serif"><g transform="translate(${m},${m})">`;
    for(const e of L.edges){if(hidden.has('edge:'+e.type)||!vis(e.source)||!vis(e.target))continue;const [c,w,d]=st[e.type]||st.data;const op=focus&&e.source!==focus&&e.target!==focus?0.15:1;s+=`<path d="M${e.points.map(q=>q.join(',')).join(' L')}" fill="none" stroke="${c}" stroke-width="${w}" opacity="${op}" ${d?`stroke-dasharray="${d}"`:''}/>`;
      if(e.label&&op===1){const k=Math.floor(e.points.length/2),a=e.points[k-1],b=e.points[k],x=(a[0]+b[0])/2,y=(a[1]+b[1])/2,tw=6.2*e.label.length+8;s+=`<rect x="${x-tw/2}" y="${y-8}" width="${tw}" height="14" rx="3" fill="${css('--surface')}" stroke="${css('--line')}"/><text x="${x}" y="${y+3}" font-size="9" font-weight="700" text-anchor="middle" fill="${c}">${esc(e.label)}</text>`;}}
    for(const [id,b] of Object.entries(L.nodes)){if(!vis(id))continue;const n=meta[id]||{},c=color(n.type),op=near(id)?1:0.25;s+=`<g opacity="${op}"><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="8" fill="${css('--surface')}" stroke="${c}" stroke-width="${id===focus?3:1.5}"/><text x="${b.x+10}" y="${b.y+18}" font-size="9" font-weight="700" fill="${c}">${esc((LABEL[n.type]||n.type||'').toUpperCase())}</text><text x="${b.x+10}" y="${b.y+36}" font-size="13" font-weight="600" fill="${css('--text')}">${esc((n.name||id).slice(0,26))}</text><text x="${b.x+10}" y="${b.y+52}" font-size="10" fill="${css('--muted')}">${esc((n.product||'').slice(0,30))}</text>`;
      (n.pins||[]).slice(0,8).forEach((pin,k)=>{const cx=b.x+10+(k%4)*46,cy=b.y+66+Math.floor(k/4)*24;if(cy+18>b.y+b.h)return;s+=`<rect x="${cx}" y="${cy}" width="42" height="18" rx="9" fill="none" stroke="${c}"/><text x="${cx+21}" y="${cy+12.5}" font-size="8.5" text-anchor="middle" fill="${c}">${esc(pin.length>7?pin.slice(0,6)+'…':pin)}</text>`});s+='</g>';}
    el.innerHTML=s+'</g></svg>';};
  tools.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.mode){mode=b.dataset.mode;vb=null;tools.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw();}
    if(b.dataset.zoom){if(b.dataset.zoom==='fit'){vb=null;}else{const k=b.dataset.zoom==='in'?0.8:1.25;const cx=vb[0]+vb[2]/2,cy=vb[1]+vb[3]/2;vb=[cx-vb[2]*k/2,cy-vb[3]*k/2,vb[2]*k,vb[3]*k];}draw();}};
  const onToggle=e=>{const t=e.target;if(!t.dataset||(!t.dataset.edge&&!t.dataset.cat))return;const key=t.dataset.edge?'edge:'+t.dataset.edge:'cat:'+t.dataset.cat;t.checked?hidden.delete(key):hidden.add(key);draw();};
  tools.onchange=onToggle;side.onchange=onToggle;

  el.onpointermove=e=>{if(!drag||!vb)return;const k=vb[2]/el.clientWidth;vb=[vb[0]-(e.clientX-drag[0])*k,vb[1]-(e.clientY-drag[1])*k,vb[2],vb[3]];drag=[e.clientX,e.clientY];draw();};
  el.onwheel=e=>{e.preventDefault();const k=Math.exp(e.deltaY*0.001);const cx=vb[0]+vb[2]/2,cy=vb[1]+vb[3]/2;vb=[cx-vb[2]*k/2,cy-vb[3]*k/2,vb[2]*k,vb[3]*k];draw();};
  draw();
}

// ================================================================== mech (3D)
function setupMech(p){

  if(!L||!L.parts||!window.THREE){tools.innerHTML=`<span id="mechinfo">${window.THREE?'No mechanical layout.':'3D view needs three.js (offline?)'}</span>`;side.hidden=true;return;}

  const scene=new T.Scene(), cam=new T.PerspectiveCamera(45,1,0.1,8000);scene.add(new T.AmbientLight(0xffffff,0.7));const dl=new T.DirectionalLight(0xffffff,0.6);dl.position.set(1,2,1.5);scene.add(dl);
  const EX=X.exploded;const bb=(EX||L).bbox;const lo=L.bbox.min,hi=L.bbox.max,ctr=[(lo[0]+hi[0])/2,(lo[1]+hi[1])/2,(lo[2]+hi[2])/2],diag=Math.hypot(...bb.size)||100;

  const origin=new T.Vector3(lo[0],lo[1],hi[2]);
  for(const [end] of axes){const g=new T.BufferGeometry().setFromPoints([origin,new T.Vector3(...end)]);scene.add(new T.Line(g,new T.LineBasicMaterial({color:new T.Color(css('--text'))})));}

  const meshes=window.HWBP_MESHES||{};const objs={};
  for(const [id,part] of Object.entries(L.parts)){let geo;const mm=meshes[id];
    if(mm){geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(mm.v,3));geo.setIndex(mm.f);geo.computeVertexNormals();}
    else geo=part.shape==='cylinder'?new T.CylinderGeometry(Math.min(part.size[0],part.size[2])/2,Math.min(part.size[0],part.size[2])/2,part.size[1],32):new T.BoxGeometry(...part.size);
    const c=new T.Color(part.color), elec=['mcu','sensor','actuator','power','module','display'].includes(part.type);
    const mesh=new T.Mesh(geo,new T.MeshStandardMaterial({color:c,transparent:true,opacity:mm?0.85:(elec?0.35:0.25),side:T.DoubleSide,roughness:.8}));
    const edges=new T.LineSegments(new T.EdgesGeometry(geo,15),new T.LineBasicMaterial({color:c}));const g=new T.Group();g.add(mesh);g.add(edges);g.position.set(...part.pos);scene.add(g);objs[id]={g,type:part.type,on:true};}
  const HOME={th:0.8,ph:0.9,dist:diag*1.6};let {th,ph,dist}=HOME;
  const resize=()=>{const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();};
  const draw=()=>{cam.position.set(ctr[0]+dist*Math.sin(ph)*Math.cos(th),ctr[1]+dist*Math.cos(ph),ctr[2]+dist*Math.sin(ph)*Math.sin(th));cam.lookAt(...ctr);r.render(scene,cam);
    const w=canvas.clientWidth,h=canvas.clientHeight,spans=labels.children;axes.forEach(([end],i)=>{const v=origin.clone().lerp(new T.Vector3(...end),0.5).project(cam);spans[i].style.left=((v.x+1)/2*w)+'px';spans[i].style.top=((1-v.y)/2*h)+'px';spans[i].style.display=v.z<1?'':'none';});};
  tools.innerHTML=`<span id="mechinfo">X ${Math.round(L.bbox.size[0])} · Y ${Math.round(L.bbox.size[1])} · Z ${Math.round(L.bbox.size[2])} mm · ${Object.keys(L.parts).length} parts</span>
    <button class="btn sm" id="mhome" aria-label="Reset view" title="Reset view">${ICON.home}</button><button class="btn sm" id="mfull" aria-label="Full screen" title="Full screen">${ICON.full}</button>${EX?'<button class="btn sm" id="explode" aria-pressed="false">Explode</button>':''}`;
  $('mhome').onclick=()=>{({th,ph,dist}=HOME);draw();};
  $('mfull').onclick=()=>{const w=$('mechwrap');if(document.fullscreenElement)document.exitFullscreen();else if(w.requestFullscreen)w.requestFullscreen();};
  document.addEventListener('fullscreenchange',()=>setTimeout(()=>{resize();draw();},50));
  const ex=$('explode');if(ex)ex.onclick=()=>{const on=ex.getAttribute('aria-pressed')!=='true';ex.setAttribute('aria-pressed',on);for(const [id,o] of Object.entries(objs))o.g.position.set(...((on?EX:L).parts[id].pos));draw();};
  // sidebar: assembly tree with per-part visibility + CAD status, legend with per-type toggles
  const types=[...new Set(Object.values(L.parts).map(q=>q.type))];
  side.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><p class="label" style="margin:0">Parts</p><span class="small muted" id="cadcount"></span></div>
    <div id="mtree" style="margin-top:6px">${(L.tree||[]).filter(row=>objs[row.id]).map(row=>`<div class="row" data-id="${esc(row.id)}" style="padding-left:${row.depth*14}px">${row.depth?'<span class="muted">└</span>':''}<button class="eye" data-eye="${esc(row.id)}" aria-label="Hide ${esc(row.name)}" aria-pressed="true">${ICON.eye}</button><span class="dot" style="background:${color(row.type)}"></span><span class="name" title="${esc(row.name)}">${esc(row.name)}</span><span class="cadslot" data-cad="${esc(row.id)}"></span></div>`).join('')}</div>
    <div class="legend">${types.map(t=>`<label><input type="checkbox" data-type="${esc(t)}" checked/><span class="dot" style="background:${color(t)}"></span>${esc(LABEL[t]||t)} <span class="muted">(${Object.values(L.parts).filter(q=>q.type===t).length})</span></label>`).join('')}</div>
    ${(L.collisions||[]).length?`<p class="sev-warning small">Interference: ${L.collisions.map(c=>c.join(' × ')).join(', ')}</p>`:''}<div id="cadmsg" class="small" style="margin-top:8px"></div>`;
  const setEye=(id,on)=>{const o=objs[id];if(!o)return;o.on=on;o.g.visible=on;const b=side.querySelector(`[data-eye="${CSS.escape(id)}"]`);if(b){b.innerHTML=on?ICON.eye:ICON.eyeoff;b.setAttribute('aria-pressed',on);b.closest('.row').classList.toggle('off',!on);}};
  side.onclick=e=>{const b=e.target.closest('[data-eye]');if(b){setEye(b.dataset.eye,!objs[b.dataset.eye].on);draw();}};
  side.onchange=e=>{const t=e.target.dataset.type;if(!t)return;for(const [id,o] of Object.entries(objs))if(o.type===t)setEye(id,e.target.checked);draw();};
  let drag=null;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>drag=null;
  canvas.onpointermove=e=>{if(!drag)return;th+=(e.clientX-drag[0])*0.01;ph=Math.max(0.1,Math.min(3.0,ph-(e.clientY-drag[1])*0.01));drag=[e.clientX,e.clientY];draw();};
  canvas.onwheel=e=>{e.preventDefault();dist*=Math.exp(e.deltaY*0.001);draw();};addEventListener('resize',()=>{resize();draw()});resize();draw();
  if(PID)setupCad();
}
async function setupCad(){
  const msg=$('cadmsg');let state;
  const paint=()=>{$('cadcount').textContent=`CAD ${state.done}/${state.eligible.length} · ${state.wallet.unlimited?'unlimited':state.wallet.balance+' credits'}`;
    document.querySelectorAll('.cadslot').forEach(slot=>{const id=slot.dataset.cad;if(!state.eligible.includes(id)){slot.innerHTML='';return;}const j=state.jobs[id];
      if(j&&j.status==='succeeded')slot.innerHTML=`<details class="menu"><summary class="cadbtn done" aria-label="CAD files for ${esc(id)}">CAD</summary><div class="items">${j.artifacts.map(a=>`<a href="/api/cad-jobs/${esc(j.id)}/artifacts/${esc(a)}" download>${esc(a.split('.').pop().toUpperCase())} <span class="muted small">${esc(a)}</span></a>`).join('')}<div class="sep"></div><span class="small muted" style="padding:6px 10px;display:block">${j.stats?esc(j.stats.triangles+' triangles · '+Math.round(j.stats.volumeMm3)+' mm³'):''}</span></div></details>`;
      else slot.innerHTML=`<button class="cadbtn" data-gen="${esc(id)}" ${canEdit()?'':'disabled'} title="Generate CAD for this part" aria-label="Generate CAD for ${esc(id)}">○</button>`;});};
  try{state=await api(`/api/projects/${PID}/cad-jobs`);paint();}catch(e){msg.textContent='CAD status unavailable.';return;}
  $('mechside').addEventListener('click',async e=>{const b=e.target.closest('[data-gen]');if(!b)return;b.classList.add('busy');b.textContent='…';
    try{const j=await api('/api/cad-jobs/part',{projectId:PID,nodeId:b.dataset.gen});state=await api(`/api/projects/${PID}/cad-jobs`);paint();msg.innerHTML=j.status==='succeeded'?`<span class="ok">CAD ready for ${esc(b.dataset.gen)}</span>`:`<span class="err">CAD ${esc(j.status)}: ${esc(j.error||'')}</span>`;}
    catch(err){b.classList.remove('busy');b.textContent='○';msg.innerHTML=err.status===402?'You are out of CAD credits. <a href="/pricing">Get more credits</a> to keep generating.':`<span class="err">Could not generate CAD: ${esc(err.message)}</span>`;}});
}

// ================================================================== instructions
function renderGuide(p,nodes){
  const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  const doneKey='hwbp:'+(p.imagePromptSnapshot&&p.imagePromptSnapshot.designHash||p.projectName);const done=store(doneKey)||{};
  const pre=p.instructionPreamble||{tools:[],assumptions:[]};const D=X.details||{};const steps=p.instructionSteps||[];
  const all=steps.flatMap(s=>s.subSteps.map(ss=>ss.id));
  const card=id=>{const n=byId[id];if(!n)return `<div class="pcard"><div class="ic">${ICON.chip}</div><div class="small">${esc(id)}</div></div>`;const printed=PRINTED.has(n.type)&&n.printSettings;
    return `<div class="pcard"><div class="ic" style="color:${color(n.type)}">${printed?ICON.print:ICON.chip}</div><div style="min-width:0"><div class="small" style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n.name)}</div><div class="small muted">${printed?'3D Print':esc(LABEL[n.type]||n.type)}${(n.quantity||1)>1?' × '+n.quantity:''}</div></div></div>`;};
  $('tab-guide').innerHTML=`<div class="card progressbar"><b class="small" style="letter-spacing:.06em;text-transform:uppercase">Instructions <span class="muted" id="gdone"></span></b><div class="meter" aria-hidden="true"><i id="gmeter"></i></div></div>
  <div class="card"><p class="label">Tools &amp; assumptions</p><div class="cols"><div><b class="small">Tools</b><ul class="small">${pre.tools.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div><div><b class="small">Assumptions</b><ul class="small">${pre.assumptions.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div></div></div>`+
  steps.map((s,i)=>`<div class="step" data-sid="${esc(s.id)}"><div class="head"><b>${i+1}. ${esc(s.title||s.id)}</b><span class="count" data-scount="${esc(s.id)}"></span></div>${s.subSteps.map((ss,j)=>`<div class="sub"><label class="step-title"><input type="checkbox" data-step="${esc(ss.id)}" ${done[ss.id]?'checked':''}/> <span><span class="muted">${i+1}.${j+1}</span> ${esc(ss.title)}</span></label>
    ${(ss.tools||[]).length?`<div class="chips">${ss.tools.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>`:''}
    ${(ss.partIds||[]).length?`<div class="pcards">${ss.partIds.map(card).join('')}</div>`:''}
    <div class="more"><button class="btn ghost sm" data-more="${esc(s.id)}|${esc(ss.id)}" aria-expanded="false">View details ›</button><div class="moreout" hidden></div></div></div>`).join('')}</div>`).join('');
  const count=()=>{const n=all.filter(id=>done[id]).length;$('gdone').textContent=`${n}/${all.length} done`;$('gmeter').style.width=(all.length?100*n/all.length:0)+'%';
    steps.forEach(s=>{const k=s.subSteps.filter(ss=>done[ss.id]).length,el=document.querySelector(`[data-scount="${CSS.escape(s.id)}"]`);el.textContent=`${k}/${s.subSteps.length}`;el.classList.toggle('full',k===s.subSteps.length);});};
  document.querySelectorAll('[data-step]').forEach(cb=>cb.onchange=()=>{done[cb.dataset.step]=cb.checked;store(doneKey,done);count();});count();
  document.querySelectorAll('[data-more]').forEach(b=>b.onclick=async()=>{const out=b.nextElementSibling;const open=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',!open);b.textContent=open?'View details ›':'Hide details ‹';out.hidden=open;if(open||out.dataset.loaded)return;
    const [sid,ssid]=b.dataset.more.split('|');let d=D[ssid];
    if(!d&&PID){try{d=await api(`/api/projects/${PID}/instructions/${encodeURIComponent(sid)}/${encodeURIComponent(ssid)}/detail`);}catch(e){d=null;}}
    out.dataset.loaded='1';out.innerHTML=(d?`<p class="small">${esc(d.summary)}</p><ol class="small">${d.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p class="small"><b>Tip:</b> ${esc(d.tip)}</p>`:'<p class="small muted">No extra details for this step.</p>')+
      (PID?`<img alt="Illustration of step ${esc(ssid)}" loading="lazy" style="max-width:min(100%,520px);border-radius:8px;border:1px solid var(--line)" src="/api/projects/${esc(PID)}/steps/${esc(sid)}/${esc(ssid)}/image.svg"/>`:'');});
}

// ================================================================== share / history dialogs
async function openShare(){
  const body=openDialog('Share project','<p class="small muted">Loading…</p>');
  const paint=async()=>{let meta,members,links,invites;try{[meta,members,links,invites]=await Promise.all([api(`/api/projects/${PID}/meta`),api(`/api/projects/${PID}/members`),api(`/api/projects/${PID}/share-links`),api(`/api/projects/${PID}/invitations`)]);}catch(e){body.innerHTML='<p class="err small">Sharing settings are unavailable: '+esc(e.message)+'</p>';return;}
    const pub=meta.published;const abs=u=>location.origin+u;
    body.innerHTML=`<h4 style="margin-top:0">Community</h4>${pub?`<div class="rowf"><input type="text" readonly value="${esc(abs(pub.url))}" style="flex:1" aria-label="Public link"/><button class="btn sm" data-copy="${esc(abs(pub.url))}">Copy link</button><a class="btn sm" href="${esc(pub.url)}" target="_blank" rel="noopener">Open</a><button class="btn sm" id="unpub">Unpublish</button></div><p class="small muted">★ ${pub.starCount} · anyone with the link can view and copy it.</p>`
      :'<div class="rowf"><button class="btn primary sm" id="pubbtn">Publish to community</button><span class="small muted">Makes a read-only copy that anyone can view, star and copy.</span></div>'}
      <h4>Invite by email</h4><form class="rowf" id="invform"><label class="small muted" for="invemail">Email</label><input type="email" id="invemail" required placeholder="name@example.com" style="flex:1;min-width:180px"/><label class="small muted" for="invrole">Role</label><select id="invrole"><option value="viewer">Viewer</option><option value="editor">Editor</option></select><button class="btn sm">Invite</button></form><div id="invout" class="small"></div>
      ${invites.invitations.length?`<div class="list">${invites.invitations.map(i=>`<div class="li"><span>${esc(i.email)} <span class="muted">· ${esc(i.role)} · pending</span></span><button class="btn sm" data-revinv="${esc(i.id)}">Revoke</button></div>`).join('')}</div>`:''}
      <h4>Share link</h4><div class="rowf"><label class="small muted" for="linkrole">Anyone with the link joins as</label><select id="linkrole"><option value="viewer">Viewer</option><option value="editor">Editor</option></select><button class="btn sm" id="mklink">Create link</button></div><div id="linkout" class="small"></div>
      ${links.shareLinks.length?`<div class="list">${links.shareLinks.map(l=>`<div class="li"><span>${esc(l.role)} link <span class="muted">${l.expiresAt?'· expires '+new Date(l.expiresAt*1000).toLocaleDateString():''}</span></span><button class="btn sm" data-revlink="${esc(l.id)}">Revoke</button></div>`).join('')}</div>`:''}
      <h4>Members</h4><div class="list">${members.members.map(m=>`<div class="li"><span>${esc(m.userId)}</span>${m.role==='owner'?'<span class="muted small">owner</span>':`<span class="rowf"><label class="sr" for="role-${esc(m.userId)}" hidden>Role</label><select id="role-${esc(m.userId)}" data-member="${esc(m.userId)}"><option ${m.role==='editor'?'selected':''} value="editor">Editor</option><option ${m.role==='viewer'?'selected':''} value="viewer">Viewer</option></select><button class="btn sm" data-rm="${esc(m.userId)}">Remove</button></span>`}</div>`).join('')}</div>`;
    const on=(sel,fn)=>body.querySelectorAll(sel).forEach(el=>el.onclick=fn);
    on('[data-copy]',e=>{navigator.clipboard&&navigator.clipboard.writeText(e.currentTarget.dataset.copy);toast('Link copied');});
    if($('pubbtn'))$('pubbtn').onclick=async()=>{try{await api('/api/publish',{projectId:PID});toast('Published to the community');paint();}catch(e){toast('Could not publish: '+e.message);}};
    if($('unpub'))$('unpub').onclick=async()=>{try{await api('/api/unpublish',{projectId:PID});toast('Removed from the community');paint();}catch(e){toast('Could not unpublish: '+e.message);}};
    $('invform').onsubmit=async e=>{e.preventDefault();try{const r=await api(`/api/projects/${PID}/invitations`,{email:$('invemail').value,role:$('invrole').value});$('invout').innerHTML=`Invitation link: <code>${esc(abs(r.url))}</code>`;setTimeout(paint,1500);}catch(err){$('invout').innerHTML=`<span class="err">${esc(err.message)}</span>`;}};
    $('mklink').onclick=async()=>{try{const r=await api(`/api/projects/${PID}/share-links`,{role:$('linkrole').value});$('linkout').innerHTML=`New link: <code>${esc(abs(r.url))}</code> <button class="btn sm" data-copy2="${esc(abs(r.url))}">Copy</button>`;$('linkout').querySelector('[data-copy2]').onclick=e=>{navigator.clipboard&&navigator.clipboard.writeText(e.currentTarget.dataset.copy2);toast('Link copied');};}catch(err){$('linkout').innerHTML=`<span class="err">${esc(err.message)}</span>`;}};
    on('[data-revinv]',async e=>{try{await api(`/api/projects/${PID}/invitations/${e.currentTarget.dataset.revinv}`,undefined,'DELETE');paint();}catch(err){toast('Could not revoke: '+err.message);}});
    on('[data-revlink]',async e=>{try{await api(`/api/projects/${PID}/share-links/${e.currentTarget.dataset.revlink}`,undefined,'DELETE');paint();}catch(err){toast('Could not revoke: '+err.message);}});
    on('[data-rm]',async e=>{try{await api(`/api/projects/${PID}/members/${encodeURIComponent(e.currentTarget.dataset.rm)}`,undefined,'DELETE');paint();}catch(err){toast('Could not remove: '+err.message);}});
    body.querySelectorAll('[data-member]').forEach(s=>s.onchange=async()=>{try{await api(`/api/projects/${PID}/members/${encodeURIComponent(s.dataset.member)}`,{role:s.value},'PATCH');toast('Role updated');}catch(err){toast('Could not change the role: '+err.message);paint();}});};
  paint();
}
async function openHistory(){
  const body=openDialog('Version history','<p class="small muted">Loading…</p>');
  try{const [v,head]=await Promise.all([api(`/api/projects/${PID}/versions`),api(`/api/projects/${PID}/head`)]);
    body.innerHTML=`<p class="small muted">Restoring a version saves it as a new version; nothing is lost.</p><div class="list">${v.versions.slice().reverse().map(n=>`<div class="li"><span>Version ${n}${n===head.version?' <span class="badge ok">current</span>':''}</span>${n!==head.version&&canEdit()?`<button class="btn sm" data-restore="${n}">Restore</button>`:''}</div>`).join('')}</div>`;
    body.querySelectorAll('[data-restore]').forEach(b=>b.onclick=async()=>{try{await api(`/api/projects/${PID}/restore/${b.dataset.restore}`,{});location.reload();}catch(e){toast('Could not restore: '+e.message);}});}
  catch(e){body.innerHTML='<p class="err small">History is unavailable: '+esc(e.message)+'</p>';}
}

// ================================================================== chat + live updates
async function loadChips(){try{const s=await api(`/api/projects/${PID}/suggested-prompts`);const list=(s.edit||[]).slice(0,3).concat((s.ask||[]).slice(0,2));
  $('pchips').innerHTML=list.map(t=>`<button type="button">${esc(t)}</button>`).join('');$('pchips').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('chatinput').value=b.textContent;$('chatinput').focus();});}catch(e){$('pchips').innerHTML='';}}
async function refreshChat(){
  if(!PID)return;const log=$('chatlog');
  try{const s=await api(`/api/projects/${PID}/chat`);
    log.innerHTML=s.turns.map(t=>`<div class="turn"><b>${esc(t.prompt)}</b><div class="small muted">${esc(t.status)}${t.resultKind?' · '+esc(t.resultKind):''}</div>${t.responseText?`<div class="small">${esc(t.responseText)}</div>`:''}${t.plan?`<div class="small">Plan: ${esc(t.plan.plan)}</div>`:''}${t.status==='awaiting_approval'?`<div class="actions"><button class="btn primary" data-op="approve" data-turn="${esc(t.id)}">Approve</button><button class="btn" data-op="dismiss" data-turn="${esc(t.id)}">Dismiss</button></div>`:''}</div>`).join('')||'<p class="small muted">Ask about the design or request a change.</p>';
    log.querySelectorAll('[data-op]').forEach(b=>b.onclick=async()=>{try{await api(`/api/projects/${PID}/chat/${b.dataset.turn}/${b.dataset.op}`,{});if(b.dataset.op==='approve')location.reload();else refreshChat();}catch(e){toast('Could not '+b.dataset.op+': '+e.message)}});
    log.scrollTop=log.scrollHeight;}catch(e){log.innerHTML='<p class="small sev-error">Chat is unavailable: '+esc(e.message)+'</p>';}
}
async function sendChat(e){e.preventDefault();const inp=$('chatinput');const msg=inp.value.trim();if(!msg)return;inp.value='';
  try{await api(`/api/projects/${PID}/chat`,{message:msg,autoApprove:false});}catch(err){toast('Message failed: '+err.message);}refreshChat();}
function liveEvents(){try{const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+`/api/projects/${PID}/events`);
  ws.onopen=()=>ws.send(JSON.stringify({type:'authenticate'}));
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data);}catch(e){return;}
    if(m.type==='project_changed'&&API.meta&&m.version>API.meta.version){const b=$('banner');b.hidden=false;b.innerHTML='This project was changed. <button class="btn sm" id="reload">Reload</button>';$('reload').onclick=()=>location.reload();}
    if(m.type==='chat_changed'&&!$('chat').hidden)refreshChat();};}catch(e){}}
})();
</script>
